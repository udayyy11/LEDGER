<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In / Sign Up — LEDGER</title>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/stly.css">
  <link rel="stylesheet" href="css/auth.css">

  <!-- Firebase v10 Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-brand">
      <div class="mark">L</div>
      <h1>LEDGER Cloud</h1>
      <p>Sign in to sync your score engine across all your devices.</p>
    </div>

    <div class="auth-alert" id="authAlert"></div>

    <div class="auth-tabs">
      <button class="auth-tab-btn active" id="tabSignIn" onclick="setAuthMode('signin')">Sign In</button>
      <button class="auth-tab-btn" id="tabSignUp" onclick="setAuthMode('signup')">Create Account</button>
    </div>

    <form class="auth-form" id="authForm" onsubmit="handleAuthSubmit(event)">
      <div class="form-group">
        <label for="authEmail">Email Address</label>
        <input type="email" id="authEmail" required placeholder="you@example.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label for="authPassword">Password</label>
        <input type="password" id="authPassword" required placeholder="••••••••" autocomplete="current-password">
      </div>

      <button type="submit" class="btn-primary" id="authSubmitBtn">Sign In</button>
    </form>

    <div class="auth-divider">OR</div>

    <button class="btn-google" onclick="handleGoogleSignIn()">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Continue with Google
    </button>

    <div class="auth-footer">
      <a href="index.html">← Back to Local Dashboard</a>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let mode = 'signin';

    function setAuthMode(newMode) {
      mode = newMode;
      document.getElementById('tabSignIn').classList.toggle('active', mode === 'signin');
      document.getElementById('tabSignUp').classList.toggle('active', mode === 'signup');
      document.getElementById('authSubmitBtn').textContent = mode === 'signin' ? 'Sign In' : 'Create Account';
      hideAlert();
    }

    function showAlert(msg, isError = true) {
      const alert = document.getElementById('authAlert');
      alert.textContent = msg;
      alert.className = `auth-alert ${isError ? 'error' : 'success'}`;
    }

    function hideAlert() {
      const alert = document.getElementById('authAlert');
      alert.style.display = 'none';
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;

      if (!email || !password) return;

      try {
        if (mode === 'signin') {
          await AuthModule.signInWithEmail(email, password);
          showAlert('Sign in successful! Redirecting...', false);
        } else {
          await AuthModule.signUpWithEmail(email, password);
          showAlert('Account created! Redirecting...', false);
        }
        setTimeout(() => window.location.href = 'index.html', 1000);
      } catch (err) {
        showAlert(err.message || 'Authentication failed.');
      }
    }

    async function handleGoogleSignIn() {
      try {
        await AuthModule.signInWithGoogle();
        showAlert('Google sign in successful! Redirecting...', false);
        setTimeout(() => window.location.href = 'index.html', 1000);
      } catch (err) {
        showAlert(err.message || 'Google Sign-In failed.');
      }
    }

    // Redirect if already logged in
    document.addEventListener('DOMContentLoaded', () => {
      AuthModule.init();
      if (window.isFirebaseActive && window.firebaseAuth) {
        window.firebaseAuth.onAuthStateChanged(user => {
          if (user) window.location.href = 'index.html';
        });
      }
    });
  </script>
</body>
</html>
