<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Routine.Book — Daily Planner &amp; Yearbook</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root{
  --paper:#F2EFE3;
  --paper-line:#D9D4C0;
  --card:#FFFDF7;
  --ink:#1C2340;
  --ink-soft:#565C78;
  --red:#B33A3A;
  --red-soft:#E3B3B3;
  --gold:#C9962C;
  --gold-soft:#EBD48B;
  --green:#3F6B4F;
  --green-soft:#A9C9AE;
  --green-deep:#2C4F3B;
  --grey:#9A968A;
  --shadow: 0 2px 0 rgba(28,35,64,0.10), 0 8px 18px -12px rgba(28,35,64,0.25);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Space Grotesk',sans-serif;
  color:var(--ink);
  background:
    linear-gradient(var(--paper),var(--paper)),
    repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(90,95,70,0.07) 28px),
    repeating-linear-gradient(90deg, transparent, transparent 27px, rgba(90,95,70,0.045) 28px);
  min-height:100vh;
  padding:20px 20px 60px;
}
.wrap{max-width:1200px;margin:0 auto;}

/* ---------- Header ---------- */
.app-header{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
  gap:14px;margin-bottom:20px;
}
.brand{display:flex;align-items:baseline;gap:12px;}
.brand h1{
  font-family:'Kalam',cursive;font-weight:700;font-size:2.1rem;margin:0;
  color:var(--ink);letter-spacing:0.5px;
}
.brand .tag{font-size:0.75rem;color:var(--ink-soft);font-style:italic;}

.tabs{display:flex;gap:6px;background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:4px;box-shadow:var(--shadow);}
.tab-btn{
  border:none;background:transparent;font-family:'Space Grotesk';font-weight:600;
  padding:8px 16px;border-radius:7px;cursor:pointer;color:var(--ink-soft);font-size:0.9rem;
}
.tab-btn.active{background:var(--ink);color:var(--paper);}

.date-nav{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:6px 8px;box-shadow:var(--shadow);}
.date-nav button{border:none;background:none;cursor:pointer;font-size:1.1rem;color:var(--ink);width:28px;height:28px;border-radius:6px;}
.date-nav button:hover{background:var(--paper-line);}
.date-nav input[type=date]{border:none;background:none;font-family:'JetBrains Mono';font-weight:600;font-size:0.85rem;color:var(--ink);}
.date-nav .today-btn{font-family:'Space Grotesk';font-size:0.75rem;font-weight:600;padding:4px 10px;background:var(--gold-soft);border-radius:6px;width:auto;}

/* stamp */
.stamp{
  width:78px;height:78px;border-radius:50%;
  border:3px solid var(--red);color:var(--red);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transform:rotate(-8deg);font-family:'Kalam';font-weight:700;
  background:rgba(179,58,58,0.05);flex-shrink:0;
}
.stamp.good{border-color:var(--green-deep);color:var(--green-deep);background:rgba(44,79,59,0.06);}
.stamp.mid{border-color:var(--gold);color:#9c7519;background:rgba(201,150,44,0.08);}
.stamp .num{font-size:1.5rem;line-height:1;}
.stamp .lbl{font-size:0.5rem;letter-spacing:0.05em;text-transform:uppercase;}

.save-status{
  display:flex;align-items:center;gap:6px;font-family:'JetBrains Mono';font-size:0.72rem;
  color:var(--ink-soft);padding:6px 10px;border-radius:8px;transition:background 0.2s;
}
.save-status .dot{width:8px;height:8px;border-radius:50%;background:var(--grey);flex-shrink:0;transition:background 0.2s;}
.save-status.saving .dot{background:var(--gold);animation:pulse 0.9s infinite;}
.save-status.saved .dot{background:var(--green-deep);}
.save-status.error .dot{background:var(--red);}
.save-status.error{color:var(--red);}
@keyframes pulse{0%{opacity:1;}50%{opacity:0.35;}100%{opacity:1;}}

/* week strip */
.week-strip{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.week-strip .d{
  font-family:'JetBrains Mono';font-size:0.65rem;font-weight:600;
  border:1.5px solid var(--ink);border-radius:6px;padding:5px 9px;color:var(--ink-soft);
  background:var(--card);
}
.week-strip .d.today{background:var(--ink);color:var(--paper);}

/* ---------- Cards / Grid ---------- */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;}
.card{
  background:var(--card);border:2px solid var(--ink);border-radius:12px;
  padding:14px 16px 16px;box-shadow:var(--shadow);
}
.col-4{grid-column:span 4;}
.col-6{grid-column:span 6;}
.col-8{grid-column:span 8;}
.col-12{grid-column:span 12;}
.row-span-2{grid-row:span 2;}

.card h3{
  margin:0 0 10px;font-family:'Kalam';font-weight:700;font-size:1.05rem;
  display:flex;align-items:center;gap:7px;color:var(--ink);
  border-bottom:2px dashed var(--paper-line);padding-bottom:8px;
}
.card h3 .pct{margin-left:auto;font-family:'JetBrains Mono';font-size:0.7rem;font-weight:600;color:var(--ink-soft);}

/* checklist rows */
.check-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.check-row input[type=checkbox]{
  width:17px;height:17px;accent-color:var(--green-deep);cursor:pointer;flex-shrink:0;
}
.check-row input[type=text]{
  flex:1;border:none;border-bottom:1.5px dotted var(--paper-line);background:transparent;
  font-family:'Space Grotesk';font-size:0.88rem;padding:3px 2px;color:var(--ink);
}
.check-row input[type=text]:focus{outline:none;border-bottom-color:var(--ink);}
.check-row.done input[type=text]{text-decoration:line-through;color:var(--grey);}

/* water */
.cups{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.cup{
  width:30px;height:36px;border:2px solid var(--ink);border-radius:4px 4px 8px 8px;
  cursor:pointer;position:relative;background:transparent;
}
.cup.filled{background:linear-gradient(#8fc5e8,#8fc5e8);}
.water-label{font-family:'JetBrains Mono';font-size:0.75rem;color:var(--ink-soft);}

/* meals */
.meal-row{margin-bottom:8px;}
.meal-row label{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);font-weight:600;}
.meal-row input{width:100%;border:none;border-bottom:1.5px dotted var(--paper-line);background:transparent;padding:4px 2px;font-family:'Space Grotesk';font-size:0.87rem;}
.meal-row input:focus{outline:none;border-bottom-color:var(--ink);}

/* schedule */
.sched-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.sched-row .time{font-family:'JetBrains Mono';font-size:0.68rem;color:var(--ink-soft);width:62px;flex-shrink:0;}
.sched-row input{flex:1;border:none;border-bottom:1.5px dotted var(--paper-line);background:transparent;font-size:0.83rem;padding:3px 2px;font-family:'Space Grotesk';}
.sched-row input:focus{outline:none;border-bottom-color:var(--ink);}

/* work progress */
.wp-row{display:flex;align-items:center;gap:12px;}
.wp-row input[type=range]{flex:1;accent-color:var(--green-deep);}
.wp-val{font-family:'JetBrains Mono';font-weight:700;font-size:1.1rem;width:52px;text-align:right;}

/* expenses */
.exp-row{display:flex;gap:6px;margin-bottom:6px;align-items:center;}
.exp-row input[type=text]{flex:1;border:none;border-bottom:1.5px dotted var(--paper-line);background:transparent;padding:3px 2px;font-size:0.85rem;font-family:'Space Grotesk';}
.exp-row input[type=number]{width:78px;border:none;border-bottom:1.5px dotted var(--paper-line);background:transparent;padding:3px 2px;font-family:'JetBrains Mono';font-size:0.85rem;text-align:right;}
.exp-row input:focus{outline:none;border-bottom-color:var(--ink);}
.exp-row button{border:none;background:none;color:var(--red);cursor:pointer;font-size:1rem;}
.exp-add{font-family:'Space Grotesk';font-size:0.78rem;font-weight:600;border:1.5px dashed var(--ink-soft);background:none;border-radius:7px;padding:5px 10px;cursor:pointer;color:var(--ink-soft);margin-top:2px;}
.exp-total{margin-top:8px;font-family:'JetBrains Mono';font-weight:700;font-size:0.9rem;text-align:right;border-top:1.5px dashed var(--paper-line);padding-top:6px;}

/* mood */
.mood-grid{display:flex;flex-wrap:wrap;gap:7px;}
.mood-btn{
  border:2px solid var(--paper-line);background:var(--paper);border-radius:8px;
  padding:7px 6px;cursor:pointer;font-size:1.3rem;line-height:1;flex:1 1 40px;text-align:center;
}
.mood-btn.sel{border-color:var(--ink);background:var(--gold-soft);}

textarea{
  width:100%;min-height:78px;border:none;background:transparent;resize:vertical;
  font-family:'Space Grotesk';font-size:0.87rem;padding:2px;line-height:1.4;
}
textarea:focus{outline:none;}

/* ---------- Dashboard ---------- */
.dash-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px;}
.year-nav{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:6px 12px;box-shadow:var(--shadow);}
.year-nav button{border:none;background:none;cursor:pointer;font-size:1.1rem;}
.year-nav .yr{font-family:'Kalam';font-weight:700;font-size:1.3rem;}

.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
.stat-card{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:14px;box-shadow:var(--shadow);}
.stat-card .v{font-family:'JetBrains Mono';font-weight:700;font-size:1.7rem;color:var(--green-deep);}
.stat-card .l{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);font-weight:600;margin-top:2px;}

.months-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
.month-card{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:12px;box-shadow:var(--shadow);}
.month-card h4{margin:0 0 8px;font-family:'Kalam';font-size:0.95rem;display:flex;justify-content:space-between;}
.month-card h4 .avg{font-family:'JetBrains Mono';font-size:0.68rem;color:var(--ink-soft);}
.mini-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.mini-cal .cell{
  aspect-ratio:1;border-radius:3px;font-size:0.55rem;display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono';color:var(--ink);cursor:pointer;border:1px solid rgba(28,35,64,0.06);
}
.mini-cal .cell.empty{visibility:hidden;cursor:default;}
.mini-cal .cell.future{opacity:0.35;cursor:default;}

.bars-card{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:16px;box-shadow:var(--shadow);margin-bottom:20px;}
.bars-card h3{font-family:'Kalam';margin:0 0 14px;}

.perf-card{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:18px 18px 10px;box-shadow:var(--shadow);margin-bottom:20px;}
.perf-card h3{font-family:'Kalam';margin:0;font-size:1.15rem;}
.perf-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:6px;}
.perf-sub{font-family:'JetBrains Mono';font-size:0.72rem;color:var(--ink-soft);}
.perf-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;}
.perf-legend span{font-family:'JetBrains Mono';font-size:0.68rem;color:var(--ink-soft);display:flex;align-items:center;gap:5px;}
.perf-legend .sw{width:12px;height:3px;border-radius:2px;display:inline-block;}
.perf-point:hover{r:6;}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
.bar-col .bar{width:100%;border-radius:4px 4px 0 0;background:var(--green-soft);min-height:2px;}
.bar-col .ml{font-size:0.6rem;color:var(--ink-soft);margin-top:4px;font-family:'JetBrains Mono';}

.mood-summary{display:flex;flex-wrap:wrap;gap:10px;}
.mood-chip{background:var(--paper);border:1.5px solid var(--paper-line);border-radius:20px;padding:6px 12px;font-size:0.8rem;display:flex;gap:6px;align-items:center;font-family:'JetBrains Mono';}

.empty-state{text-align:center;padding:40px 20px;color:var(--ink-soft);font-style:italic;}

@media(max-width:820px){
  .col-4,.col-6,.col-8{grid-column:span 12;}
  .months-grid{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:480px){
  .months-grid{grid-template-columns:1fr;}
  .brand h1{font-size:1.6rem;}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="app-header">
    <div class="brand">
      <h1>Routine.Book</h1>
      <span class="tag">your year, one page at a time</span>
    </div>
    <div class="tabs">
      <button class="tab-btn" id="tabDaily" onclick="switchTab('daily')">Daily Planner</button>
      <button class="tab-btn" id="tabDash" onclick="switchTab('dashboard')">Yearbook</button>
    </div>
  </div>

  <div id="dailyView"></div>
  <div id="dashboardView" style="display:none;"></div>
</div>

<script>
/* ===================== STATE ===================== */
let currentDate = new Date();
let currentEntry = null;
let dailyScores = {};       // {dateStr: {score, mood, logged}}
let currentTab = 'daily';
let dashYear = new Date().getFullYear();
let saveTimer = null;
let storageReady = true;

const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MOODS = [
  {k:'great', e:'🤩', l:'Great'},
  {k:'happy', e:'😊', l:'Happy'},
  {k:'calm', e:'😌', l:'Calm'},
  {k:'tired', e:'😴', l:'Tired'},
  {k:'stressed', e:'😣', l:'Stressed'},
  {k:'sad', e:'😢', l:'Sad'},
  {k:'angry', e:'😠', l:'Angry'},
  {k:'sick', e:'🤒', l:'Sick'},
];

/* ===================== UTIL ===================== */
function fmt(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function esc(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }

function makeItems(n){ return Array.from({length:n},()=>({text:'',done:false})); }
function formatHour(h){ const ampm=h<12?'AM':'PM'; let hh=h%12; if(hh===0)hh=12; return hh+':00'+ampm; }
function makeSchedule(){
  const hours=[];
  for(let h=6;h<=21;h++) hours.push({time:formatHour(h), text:''});
  return hours;
}
function defaultEntry(dateStr){
  return {
    date: dateStr,
    priorities: makeItems(3),
    health: makeItems(6),
    personalTodo: makeItems(6),
    calls: makeItems(5),
    todoList: makeItems(8),
    water: 0,
    meals: {breakfast:'', lunch:'', dinner:''},
    schedule: makeSchedule(),
    appointments: makeItems(4),
    workProgress: 0,
    expenses: [],
    mood: '',
    notesTomorrow: '',
    notes: '',
    score: 0
  };
}

/* ===================== STORAGE ===================== */
async function loadDailyScores(){
  try{
    const r = window.localStorage.getItem('daily-scores');
    dailyScores = r ? JSON.parse(r) : {};
  }catch(e){ dailyScores = {}; }
}
async function persistDailyScores(){
  try{ window.localStorage.setItem('daily-scores', JSON.stringify(dailyScores)); }
  catch(e){ console.error('storage error', e); }
}
async function loadEntry(dateStr){
  try{
    const r = window.localStorage.getItem('entry:'+dateStr);
    if(r) return JSON.parse(r);
    return defaultEntry(dateStr);
  }catch(e){ return defaultEntry(dateStr); }
}
function setSaveStatus(state, text){
  const box = document.getElementById('saveStatus');
  const label = document.getElementById('saveStatusText');
  if(!box || !label) return;
  box.className = 'save-status '+state;
  label.textContent = text;
}

function queueSave(){
  setSaveStatus('saving','Saving…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 250);
}

function saveInstant(){
  clearTimeout(saveTimer);
  saveNow();
}

async function saveNow(retryCount){
  retryCount = retryCount || 0;
  if(!currentEntry) return;
  setSaveStatus('saving','Saving…');
  currentEntry.score = computeScore(currentEntry);
  try{
    window.localStorage.setItem('entry:'+currentEntry.date, JSON.stringify(currentEntry));
    dailyScores[currentEntry.date] = {score: currentEntry.score, mood: currentEntry.mood||'', logged:true};
    await persistDailyScores();
    setSaveStatus('saved', 'Saved '+nowTime());
  }catch(e){
    console.error('save failed', e);
    if(retryCount < 3){
      setSaveStatus('saving','Retrying…');
      setTimeout(()=>saveNow(retryCount+1), 600 * (retryCount+1));
    } else {
      setSaveStatus('error','Save failed — will retry');
      setTimeout(()=>saveNow(0), 4000);
    }
  }
  updateStamp();
}
function nowTime(){
  const d = new Date();
  return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

/* ===================== SCORING ===================== */
function ratio(arr){ if(!arr || !arr.length) return 0; return arr.filter(x=>x.done).length/arr.length; }
function computeScore(e){
  const scheduleFilled = e.schedule.filter(s=>s.text && s.text.trim()!=='').length / e.schedule.length;
  let s = 0;
  s += ratio(e.priorities)*15;
  s += ratio(e.health)*10;
  s += ratio(e.personalTodo)*10;
  s += ratio(e.calls)*5;
  s += ratio(e.todoList)*15;
  s += clamp(e.water/8,0,1)*10;
  s += scheduleFilled*10;
  s += ratio(e.appointments)*5;
  s += clamp(e.workProgress/100,0,1)*15;
  s += (e.mood ? 1:0)*5;
  return Math.round(s);
}
function scoreClass(score){
  if(score>=75) return 'good';
  if(score>=45) return 'mid';
  return '';
}
function scoreLabel(score){
  if(score>=90) return 'Legendary';
  if(score>=75) return 'Great day';
  if(score>=55) return 'Solid';
  if(score>=30) return 'Getting there';
  return 'Fresh page';
}
function scoreColor(score){
  if(score===undefined || score===null) return '#EDEAE0';
  if(score<30) return 'var(--red-soft)';
  if(score<55) return 'var(--gold-soft)';
  if(score<80) return 'var(--green-soft)';
  return 'var(--green-deep)';
}

/* ===================== RENDER: DAILY ===================== */
function checklistHTML(field, placeholder){
  const items = currentEntry[field];
  return items.map((it,i)=>`
    <div class="check-row ${it.done?'done':''}">
      <input type="checkbox" ${it.done?'checked':''} onchange="toggleCheck('${field}',${i})">
      <input type="text" value="${esc(it.text)}" placeholder="${placeholder} ${i+1}" oninput="updateText('${field}',${i},this.value)">
    </div>`).join('');
}

function weekStripHTML(date){
  const day = (date.getDay()+6)%7; // Mon=0
  const monday = new Date(date); monday.setDate(date.getDate()-day);
  let html='';
  for(let i=0;i<7;i++){
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    const isToday = fmt(d)===fmt(date);
    html += `<div class="d ${isToday?'today':''}">${DOW[i]} ${d.getDate()}</div>`;
  }
  return html;
}

function renderDaily(){
  const el = document.getElementById('dailyView');
  const dateStr = currentEntry.date;
  const niceDate = currentDate.toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric', year:'numeric'});
  const pct = (arr)=> arr.length? Math.round(ratio(arr)*100)+'%':'—';
  const scheduleFilled = currentEntry.schedule.filter(s=>s.text && s.text.trim()!=='').length;
  const expTotal = currentEntry.expenses.reduce((a,x)=>a+(parseFloat(x.amount)||0),0);

  el.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:6px;">
      <div class="date-nav">
        <button onclick="shiftDate(-1)">◀</button>
        <input type="date" value="${dateStr}" onchange="jumpDate(this.value)">
        <button onclick="shiftDate(1)">▶</button>
        <button class="today-btn" onclick="jumpDate('${fmt(new Date())}')">Today</button>
      </div>
      <div class="save-status" id="saveStatus"><span class="dot"></span><span id="saveStatusText">Loaded</span></div>
      <div class="stamp ${scoreClass(currentEntry.score)}" id="stampBox">
        <div class="num" id="stampNum">${currentEntry.score}</div>
        <div class="lbl" id="stampLbl">${scoreLabel(currentEntry.score)}</div>
      </div>
    </div>
    <div style="font-family:'JetBrains Mono';font-size:0.8rem;color:var(--ink-soft);margin-bottom:10px;">${niceDate}</div>
    <div class="week-strip">${weekStripHTML(currentDate)}</div>

    <div class="grid">
      <div class="card col-4">
        <h3>🎯 Top Priorities <span class="pct">${pct(currentEntry.priorities)}</span></h3>
        ${checklistHTML('priorities','Priority')}
      </div>
      <div class="card col-4">
        <h3>💪 Health &amp; Fitness <span class="pct">${pct(currentEntry.health)}</span></h3>
        ${checklistHTML('health','Habit')}
      </div>
      <div class="card col-4">
        <h3>📝 Personal To-Do <span class="pct">${pct(currentEntry.personalTodo)}</span></h3>
        ${checklistHTML('personalTodo','Task')}
      </div>

      <div class="card col-6">

function cupsHTML(){
  let html='';
  for(let i=0;i<8;i++){
    html+=`<div class="cup ${i<currentEntry.water?'filled':''}" onclick="setWater(${i+1})"></div>`;
  }
  return html;
}
function moodHTML(){
  return MOODS.map(m=>`<button class="mood-btn ${currentEntry.mood===m.k?'sel':''}" onclick="setMood('${m.k}')" title="${m.l}">${m.e}</button>`).join('');
}
function expensesHTML(){
  if(!currentEntry.expenses.length) return `<div style="font-size:0.8rem;color:var(--ink-soft);font-style:italic;margin-bottom:6px;">no expenses logged</div>`;
  return currentEntry.expenses.map((x,i)=>`
    <div class="exp-row">
      <input type="text" value="${esc(x.item)}" placeholder="item" oninput="updateExpense(${i},'item',this.value)">
      <input type="number" value="${x.amount}" placeholder="0.00" step="0.01" oninput="updateExpense(${i},'amount',this.value)">
      <button onclick="removeExpense(${i})">✕</button>
    </div>`).join('');
}

/* ---- lightweight partial updates (no focus loss) ---- */
function updateStamp(){
  const box = document.getElementById('stampBox');
  if(!box) return;
  box.className = 'stamp '+scoreClass(currentEntry.score);
  document.getElementById('stampNum').textContent = currentEntry.score;
  document.getElementById('stampLbl').textContent = scoreLabel(currentEntry.score);
}
function refreshPercentBadges(){
  renderDaily();
}

/* ===================== EVENT HANDLERS ===================== */
function toggleCheck(field, idx){
  currentEntry[field][idx].done = !currentEntry[field][idx].done;
  currentEntry.score = computeScore(currentEntry);
  refreshPercentBadges();
  saveInstant();
}
function updateText(field, idx, val){
  currentEntry[field][idx].text = val;
  queueSave();
}
function updateMeal(which, val){
  currentEntry.meals[which] = val;
  queueSave();
}
function updateSchedule(idx, val){
  currentEntry.schedule[idx].text = val;
  currentEntry.score = computeScore(currentEntry);
  updateStamp();
  queueSave();
}
function updateSimple(field, val){
  currentEntry[field] = val;
  queueSave();
}
function updateWorkProgress(val){
  currentEntry.workProgress = parseInt(val,10);
  document.getElementById('wpVal').textContent = currentEntry.workProgress+'%';
  currentEntry.score = computeScore(currentEntry);
  updateStamp();
  queueSave();
}
function setWater(n){
  currentEntry.water = (currentEntry.water===n) ? n-1 : n;
  document.getElementById('cupsBox').innerHTML = cupsHTML();
  currentEntry.score = computeScore(currentEntry);
  updateStamp();
  saveInstant();
}
function setMood(k){
  currentEntry.mood = (currentEntry.mood===k) ? '' : k;
  document.getElementById('moodBox').innerHTML = moodHTML();
  currentEntry.score = computeScore(currentEntry);
  updateStamp();
  saveInstant();
}
function addExpense(){
  currentEntry.expenses.push({item:'', amount:0});
  document.getElementById('expBox').innerHTML = expensesHTML();
  saveInstant();
}
function removeExpense(i){
  currentEntry.expenses.splice(i,1);
  document.getElementById('expBox').innerHTML = expensesHTML();
  document.querySelector('.exp-total').textContent = 'Total: $'+currentEntry.expenses.reduce((a,x)=>a+(parseFloat(x.amount)||0),0).toFixed(2);
  saveInstant();
}
function updateExpense(i, key, val){
  currentEntry.expenses[i][key] = key==='amount' ? val : val;
  const total = currentEntry.expenses.reduce((a,x)=>a+(parseFloat(x.amount)||0),0);
  const totalEl = document.querySelector('.exp-total');
  if(totalEl) totalEl.textContent = 'Total: $'+total.toFixed(2);
  queueSave();
}

/* ===================== DATE NAV ===================== */
async function shiftDate(delta){
  await saveNow();
  currentDate.setDate(currentDate.getDate()+delta);
  await openDate(currentDate);
}
async function jumpDate(val){
  await saveNow();
  const [y,m,d] = val.split('-').map(Number);
  currentDate = new Date(y, m-1, d);
  await openDate(currentDate);
}
async function openDate(date){
  const ds = fmt(date);
  currentEntry = await loadEntry(ds);
  currentEntry.score = computeScore(currentEntry);
  renderDaily();
}

/* ===================== DASHBOARD ===================== */
function computeStreaks(){
  const dates = new Set(Object.keys(dailyScores).filter(d=>dailyScores[d].logged));
  let cur=0; let d=new Date();
  while(true){
    const ds = fmt(d);
    if(dates.has(ds)){ cur++; d.setDate(d.getDate()-1); } else break;
  }
  const sorted = [...dates].sort();
  let best=0, run=0, prev=null;
  for(const ds of sorted){
    if(prev){
      const diff = Math.round((new Date(ds+'T00:00:00') - new Date(prev+'T00:00:00'))/86400000);
      run = (diff===1) ? run+1 : 1;
    } else run = 1;
    if(run>best) best=run;
    prev = ds;
  }
  return {current:cur, best};
}

function monthMiniCal(year, monthIdx){
  const first = new Date(year, monthIdx, 1);
  const daysInMonth = new Date(year, monthIdx+1, 0).getDate();
  const startCol = (first.getDay()+6)%7; // Mon=0
  const today = fmt(new Date());
  let cells = '';
  for(let i=0;i<startCol;i++) cells += `<div class="cell empty"></div>`;
  let sum=0, count=0;
  for(let day=1; day<=daysInMonth; day++){
    const ds = `${year}-${String(monthIdx+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const rec = dailyScores[ds];
    const isFuture = ds > today;
    const color = rec ? scoreColor(rec.score) : (isFuture ? 'transparent' : '#EDEAE0');
    const textColor = rec && rec.score>=80 ? '#F2EFE3' : 'var(--ink)';
    cells += `<div class="cell ${isFuture?'future':''}" style="background:${color};color:${textColor};" title="${ds}${rec? ' · score '+rec.score : ''}" onclick="${isFuture?'':`goToDashDate('${ds}')`}">${day}</div>`;
    if(rec){ sum+=rec.score; count++; }
  }
  const avg = count ? Math.round(sum/count) : null;
  return {html:cells, avg};
}

async function goToDashDate(ds){
  const [y,m,d] = ds.split('-').map(Number);
  currentDate = new Date(y, m-1, d);
  await openDate(currentDate);
  switchTab('daily');
}

function renderDashboard(){
  const el = document.getElementById('dashboardView');
  const yearEntries = Object.entries(dailyScores).filter(([ds])=>ds.startsWith(String(dashYear)+'-'));
  const loggedCount = yearEntries.length;
  const avgScore = loggedCount ? Math.round(yearEntries.reduce((a,[,v])=>a+v.score,0)/loggedCount) : 0;
  const best = yearEntries.reduce((b,[ds,v])=> (!b || v.score>b.score) ? {ds,score:v.score} : b, null);
  const streaks = computeStreaks();

  // months grid
  let monthsHTML = '';
  const monthlyAverages = [];
  for(let mi=0; mi<12; mi++){
    const {html, avg} = monthMiniCal(dashYear, mi);
    monthlyAverages.push(avg);
    monthsHTML += `
      <div class="month-card">
        <h4>${MONTH_NAMES[mi]} <span class="avg">${avg!==null? 'avg '+avg : '—'}</span></h4>
        <div class="mini-cal">${html}</div>
      </div>`;
  }

  // mood distribution for the year
  const moodCounts = {};
  yearEntries.forEach(([,v])=>{ if(v.mood){ moodCounts[v.mood]=(moodCounts[v.mood]||0)+1; } });
  const moodHTML2 = Object.keys(moodCounts).length ? Object.entries(moodCounts).sort((a,b)=>b[1]-a[1]).map(([k,c])=>{
    const m = MOODS.find(x=>x.k===k);
    return `<div class="mood-chip">${m?m.e:'•'} ${m?m.l:k} <strong>${c}</strong></div>`;
  }).join('') : `<span style="color:var(--ink-soft);font-style:italic;font-size:0.85rem;">no moods logged yet</span>`;

  // monthly bars
  const barsHTML = monthlyAverages.map((avg,i)=>{
    const h = avg ? Math.max(4, (avg/100)*110) : 2;
    return `<div class="bar-col"><div class="bar" style="height:${h}px; background:${avg? scoreColor(avg): 'var(--paper-line)'};"></div><div class="ml">${MONTH_NAMES[i].slice(0,3)}</div></div>`;
  }).join('');

  el.innerHTML = `
    <div class="dash-header">
      <div class="year-nav">
        <button onclick="shiftYear(-1)">◀</button>
        <span class="yr">${dashYear}</span>
        <button onclick="shiftYear(1)">▶</button>
      </div>
    </div>

    ${loggedCount===0 ? `<div class="empty-state">No pages logged yet in ${dashYear}. Fill out a Daily Planner page to start your Yearbook.</div>` : ''}

    <div class="stat-cards">
      <div class="stat-card"><div class="v">${loggedCount}</div><div class="l">Days Logged</div></div>
      <div class="stat-card"><div class="v">${avgScore}</div><div class="l">Average Score</div></div>
      <div class="stat-card"><div class="v">${streaks.current}</div><div class="l">Current Streak</div></div>
      <div class="stat-card"><div class="v">${streaks.best}</div><div class="l">Best Streak</div></div>
      <div class="stat-card"><div class="v">${best? best.score : '—'}</div><div class="l">${best? 'Best Day · '+best.ds : 'Best Day'}</div></div>
    </div>

    <div class="perf-card">
      <div class="perf-head">
        <h3>Yearly Performance</h3>
        <span class="perf-sub">${loggedCount} logged days · ${dashYear}</span>
      </div>
      ${buildPerformanceChart(dashYear)}
      <div class="perf-legend">
        <span><span class="sw" style="background:var(--paper-line);"></span>weekly average</span>
        <span><span class="sw" style="background:var(--green-deep);"></span>4-week trend</span>
        <span><span class="sw" style="background:var(--red);border-top:1.4px dashed var(--red);height:0;"></span>today</span>
      </div>
    </div>

    <div class="bars-card">
      <h3>Monthly Average Score</h3>
      <div class="bars">${barsHTML}</div>
    </div>

    <div class="months-grid">${monthsHTML}</div>

    <div class="bars-card">
      <h3>Mood Log</h3>
      <div class="mood-summary">${moodHTML2}</div>
    </div>
  `;
}

function buildWeeklySeries(year){
  const isLeap = (year%4===0 && year%100!==0) || year%400===0;
  const daysInYear = isLeap ? 366 : 365;
  const numWeeks = Math.ceil(daysInYear/7);
  const weeks = [];
  for(let w=0; w<numWeeks; w++){
    const startDay = w*7 + 1;
    const startDate = new Date(year,0,startDay);
    let sum=0, count=0;
    for(let i=0;i<7;i++){
      const d = new Date(year,0,startDay+i);
      if(d.getFullYear()!==year) break;
      const ds = fmt(d);
      const rec = dailyScores[ds];
      if(rec){ sum+=rec.score; count++; }
    }
    weeks.push({week:w, avg: count? Math.round(sum/count) : null, start: startDate, count});
  }
  return weeks;
}

function movingAverage(weeks, span){
  return weeks.map((w,i)=>{
    const slice = weeks.slice(Math.max(0,i-span+1), i+1).filter(x=>x.avg!==null);
    if(!slice.length) return null;
    return slice.reduce((a,x)=>a+x.avg,0)/slice.length;
  });
}

function buildPerformanceChart(year){
  const weeks = buildWeeklySeries(year);
  const W = 900, H = 240, padL = 34, padR = 14, padT = 14, padB = 30;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const n = weeks.length;
  const xFor = i => padL + (n<=1 ? 0 : (i/(n-1))*innerW);
  const yFor = v => padT + innerH - (clamp(v,0,100)/100)*innerH;

  // gridlines + y labels
  let grid = '';
  [0,25,50,75,100].forEach(v=>{
    const y = yFor(v);
    grid += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="rgba(28,35,64,0.10)" stroke-width="1" stroke-dasharray="${v===0?'0':'3,4'}"/>`;
    grid += `<text x="${padL-8}" y="${y+3}" font-family="JetBrains Mono" font-size="9" fill="var(--ink-soft)" text-anchor="end">${v}</text>`;
  });

  // month tick labels along x axis
  let monthTicks = '';
  for(let mi=0; mi<12; mi++){
    const d = new Date(year, mi, 1);
    const dayOfYear = Math.floor((d - new Date(year,0,1))/86400000);
    const wk = Math.min(n-1, Math.floor(dayOfYear/7));
    const x = xFor(wk);
    monthTicks += `<text x="${x}" y="${H-8}" font-family="JetBrains Mono" font-size="9" fill="var(--ink-soft)" text-anchor="middle">${MONTH_NAMES[mi].slice(0,3)}</text>`;
  }

  // raw weekly line
  let rawPath = '', seg = [];
  const flushSeg = ()=>{ if(seg.length>1) rawPath += 'M'+seg.map(p=>p.x+','+p.y).join('L')+' '; seg=[]; };
  weeks.forEach((w,i)=>{
    if(w.avg===null){ flushSeg(); return; }
    seg.push({x:xFor(i), y:yFor(w.avg)});
  });
  flushSeg();

  // 4-week moving average
  const ma = movingAverage(weeks, 4);
  let maPath='', maSeg=[];
  const flushMa = ()=>{ if(maSeg.length>1) maPath += 'M'+maSeg.map(p=>p.x+','+p.y).join('L')+' '; maSeg=[]; };
  ma.forEach((v,i)=>{
    if(v===null){ flushMa(); return; }
    maSeg.push({x:xFor(i), y:yFor(v)});
  });
  flushMa();

  let areaPath = '';
  const firstValidIdx = ma.findIndex(v=>v!==null);
  if(firstValidIdx!==-1){
    let pts = [];
    ma.forEach((v,i)=>{ if(v!==null) pts.push({x:xFor(i), y:yFor(v)}); });
    if(pts.length>1){
      areaPath = `M${pts[0].x},${yFor(0)} ` + pts.map(p=>`L${p.x},${p.y}`).join(' ') + ` L${pts[pts.length-1].x},${yFor(0)} Z`;
    }
  }

  // points with tooltips
  let points = '';
  weeks.forEach((w,i)=>{
    if(w.avg===null) return;
    const x=xFor(i), y=yFor(w.avg);
    const label = w.start.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    points += `<circle class="perf-point" cx="${x}" cy="${y}" r="3.2" fill="${scoreColor(w.avg)}" stroke="var(--ink)" stroke-width="1"><title>Week of ${label} · avg ${w.avg}</title></circle>`;
  });

  const todayWeek = (()=>{ const t=new Date(); if(t.getFullYear()!==year) return null; return Math.floor((t-new Date(year,0,1))/86400000/7); })();
  const todayLine = todayWeek!==null ? `<line x1="${xFor(todayWeek)}" y1="${padT}" x2="${xFor(todayWeek)}" y2="${H-padB}" stroke="var(--red)" stroke-width="1.4" stroke-dasharray="4,3"/>` : '';

  return `
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="220" preserveAspectRatio="xMidYMid meet">
      ${grid}
      ${areaPath ? `<path d="${areaPath}" fill="var(--green-soft)" opacity="0.28"/>` : ''}
      ${rawPath ? `<path d="${rawPath.trim()}" fill="none" stroke="var(--paper-line)" stroke-width="1.6"/>` : ''}
      ${maPath ? `<path d="${maPath.trim()}" fill="none" stroke="var(--green-deep)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>` : ''}
      ${points}
      ${todayLine}
      ${monthTicks}
    </svg>`;
}

function shiftYear(delta){
  dashYear += delta;
  renderDashboard();
}

/* ===================== TABS ===================== */
function switchTab(tab){
  currentTab = tab;
  document.getElementById('dailyView').style.display = tab==='daily' ? '' : 'none';
  document.getElementById('dashboardView').style.display = tab==='dashboard' ? '' : 'none';
  document.getElementById('tabDaily').classList.toggle('active', tab==='daily');
  document.getElementById('tabDash').classList.toggle('active', tab==='dashboard');
  if(tab==='dashboard') renderDashboard();
}

/* ===================== INIT ===================== */
async function init(){
  await loadDailyScores();
  await openDate(currentDate);
  switchTab('daily');
  window.addEventListener('beforeunload', ()=>{ if(saveTimer) saveNow(); });
}
init();
